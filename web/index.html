<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Анализ продаж</title>
  <style>
    body { margin: 0; padding: 32px 16px; background: #0a0a0a; color: #f4f4f0;
           font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    .card { max-width: 1100px; margin: 0 auto; background: #171717; border-radius: 30px; padding: 28px; }
    h1 { margin: 0 0 20px; font-size: 26px; }
    label { color: #a3a39c; margin-right: 10px; }
    select { height: 50px; padding: 0 16px; border: 0; border-radius: 16px; background: #212121;
             color: #f4f4f0; font: inherit; cursor: pointer; }
    .chart { margin-top: 20px; background: #212121; border-radius: 20px; padding: 16px; height: 520px; }
    .segments { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .seg { background: #212121; border-radius: 14px; padding: 10px 14px; }
    .seg b { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
    .seg small { color: #6b6b64; display: block; margin-top: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
