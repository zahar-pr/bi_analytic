name: bi_mongo

services:
  mongo:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "${MONGO_PORT}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 3s
      retries: 30

  app:
    build:
      context: ..
      dockerfile: mongo/Dockerfile
    env_file: .env
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: 27017
    ports:
      - "8001:8000"
    depends_on:
      mongo:
        condition: service_healthy
